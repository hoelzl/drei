name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Preserve the pre-v9 cache-size policy explicitly.
          prune-cache: true
      - run: uv --no-config sync --all-groups --locked
      - run: uv --no-config run pre-commit run --all-files
      - run: uv --no-config run pytest --cov --cov-report=term-missing
      - run: uv --no-config run mypy src tests spikes/001-editor-state-architecture

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          # Preserve the pre-v9 cache-size policy explicitly.
          prune-cache: true
      - run: uv --no-config build
      - name: Smoke-test wheel
        run: uv --no-config run --no-project --with ./dist/*.whl drei --version
        shell: bash
      - name: Smoke-test source distribution
        run: uv --no-config run --no-project --with ./dist/*.tar.gz drei --version
        shell: bash

  parity:
    name: Editor parity (pinned GNU Emacs)
    # Pinned runner image (not -latest) so distro emacs-nox stays at a known
    # version: GNU Emacs 29.3 on Ubuntu 24.04. Bump deliberately and
    # re-validate the differential scenario when moving the pin.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          emacs --version | head -1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          # Preserve the pre-v9 cache-size policy explicitly.
          prune-cache: true
      - run: uv --no-config sync --all-groups --locked
      - name: Run differential scenarios
        env:
          DREI_PARITY: "1"
        run: uv --no-config run pytest tests/differential -q
